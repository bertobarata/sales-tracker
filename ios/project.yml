name: SalesTracker
options:
  bundleIdPrefix: com.bertobarata
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: 7ACX25JD5D
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  SalesTracker:
    type: application
    platform: iOS
    sources:
      - path: SalesTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bertobarata.salestracker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Só iPhone. Suportar iPad obrigaria às quatro orientações para multitarefa
        # e a um conjunto próprio de capturas de ecrã na loja.
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: SalesTracker/Resources/SalesTracker.entitlements
    dependencies:
      - target: SalesTrackerWidgetExtension
    info:
      path: SalesTracker/Resources/Info.plist
      properties:
        CFBundleDisplayName: MetTracker
        # Sem estas duas linhas o Info.plist gerado fixa 1.0 (1) e subir
        # MARKETING_VERSION ou CURRENT_PROJECT_VERSION não muda nada.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: pt-PT
        CFBundleLocalizations:
          - pt-PT
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # O SwiftData sobre CloudKit é avisado das alterações dos outros dispositivos
        # por push silencioso. Sem este modo, a sincronização só acontece ao abrir a app.
        UIBackgroundModes:
          - remote-notification

  SalesTrackerWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SalesTrackerWidget
      - path: SalesTracker/Models
      - path: SalesTracker/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bertobarata.salestracker.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: SalesTrackerWidget/SalesTrackerWidget.entitlements
    info:
      path: SalesTrackerWidget/Info.plist
      properties:
        CFBundleDisplayName: MetTracker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  SalesTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SalesTrackerTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SalesTracker

  SalesTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SalesTrackerUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SalesTracker
    dependencies:
      - target: SalesTracker

schemes:
  SalesTracker:
    build:
      targets:
        SalesTracker: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SalesTrackerTests
        - SalesTrackerUITests
